<ion-app class="ion-padding">
  <!-- endIcon : search, dotes -->
  <!-- startIcon : profile, back -->
  <app-header startIcon="back" headerTitle="" endIcon="dotes"></app-header>

  <ion-content [fullscreen]="true">
    <ion-card>
      <ion-card-content>
        
        <img class="image-placeholder" [src]="albumDetail?.albumCover" />

        <div>
          <p><img class="artist-avatar" [src]="albumDetail?.avatar || 'assets/img/placeholder.PNG'" />{{ albumDetail?.artistName }}</p>
        </div>

        <h1>{{ albumDetail?.albumName }}</h1>

        <div class="controls">
          <ion-button shape="circle" fill="clear" class="icon-sides">
            <ion-icon slot="icon-only" name="heart-outline"></ion-icon>
          </ion-button>

          <ion-icon
            [name]="isPlaying ? 'pause-circle' : 'play-circle'"
            class="play-icon"
          ></ion-icon>

          <ion-button shape="circle" fill="clear" class="icon-sides">
            <ion-icon slot="icon-only" name="share-social-outline"></ion-icon>
          </ion-button>
        </div>

      </ion-card-content>
    </ion-card>
    
    <app-song-list *ngIf="albumDetail" value="albumDetail" headerTitle="" [hasHeader]="false" [hasGetAll]="false" [data]="albumDetail"></app-song-list>

  </ion-content>
</ion-app>
